# Render Blueprint: one web service (API + React app) and a Postgres database.
#
# Create with "New > Blueprint" pointed at this repo. Render provisions both
# services, wires DATABASE_URL between them and generates JWT_SECRET.
#
# Values marked `sync: false` are secrets: Render prompts for them in the
# dashboard and they are deliberately not stored in this file.
services:
  - type: web
    name: dialect
    runtime: python
    plan: free
    rootDir: backend
    # The API process also serves frontend/dist, so the React app is built here
    # rather than deployed separately. One origin means no CORS between the two
    # and one URL for the whole app.
    buildCommand: pip install -r requirements.txt && cd ../frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Render otherwise builds on the newest Python, which has no pydantic-core
      # wheel; pip then compiles it from Rust source and fails on the read-only
      # cargo cache. Also pinned by .python-version.
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ENVIRONMENT
        value: production
      # Seeds the shared `demo` account with sample_sales.csv on every boot and
      # shows the "Try the demo" button, so a visitor needs no signup.
      - key: DEMO_MODE
        value: "true"
      # RLIMIT_DATA on the sandbox child (see _limits.py). The API process itself
      # holds uvicorn, pandas and the parsed DataFrame -- roughly 200MB -- and
      # both live inside the instance's total RAM, 512MB on the free plan.
      # 256 + ~200 leaves room; go higher only with a larger instance, or the
      # container is OOM-killed before the sandbox's own limit can fire and
      # return a clean error.
      - key: SANDBOX_MEMORY_MB
        value: "256"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dialect-db
          property: connectionString
      # Frontend and API share an origin, so no cross-origin request is ever
      # made. Empty is both correct and enough to satisfy the production check,
      # which only rejects the localhost default.
      - key: CORS_ORIGINS
        value: ""
      # Uploads must not live on the container filesystem: it is wiped on every
      # deploy and restart. See check_production_readiness() in config.py.
      #
      # "db" keeps file bytes in the Postgres above, so this deploy needs no
      # object store and no bucket. Switch to "s3" and add S3_BUCKET,
      # S3_ENDPOINT_URL, S3_REGION and AWS credentials when uploads outgrow a
      # relational table -- storage.py puts both behind one interface, so
      # nothing else changes.
      - key: STORAGE_BACKEND
        value: db
      - key: GEMINI_API_KEY
        sync: false
      # Used by seed_admin.py, which refuses to run without it. Not needed to
      # boot -- set it only when you want an admin account.
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: dialect-db
    plan: free
