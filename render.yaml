# Render Blueprint: API + Postgres. Create with "New > Blueprint" pointed at
# this repo. Values marked `sync: false` must be filled in the dashboard --
# they are secrets and deliberately not stored here.
services:
  - type: web
    name: cwyd-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      # RLIMIT_DATA on the sandbox child (see _limits.py). The API process
      # itself holds uvicorn, pandas and the parsed DataFrame -- roughly 200MB
      # -- and both live inside the instance's total RAM, 512MB on the free
      # plan. 256 + ~200 leaves room; go higher only with a larger instance,
      # or the container is OOM-killed before the sandbox's own limit can fire
      # and return a clean error.
      - key: SANDBOX_MEMORY_MB
        value: "256"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cwyd-db
          property: connectionString
      # Uploads must not live on the container filesystem: it is wiped on every
      # deploy and restart. See check_production_readiness() in config.py.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # No trailing slash. Must match the Vercel domain exactly or the browser
      # blocks every request as a CORS failure.
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: cwyd-db
    plan: free
